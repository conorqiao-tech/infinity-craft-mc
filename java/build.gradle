plugins { id 'net.fabricmc.fabric-loom' version '1.18.2' }
version = project.mod_version
group = 'dev.convergence'
base { archivesName = 'Infinity-Armor' }
repositories {
 maven { url = uri('../vendor/snapshot5/maven'); content { includeGroup 'eu.pb4' } }
 mavenCentral()
 maven { url 'https://maven.nucleoid.xyz' }
 maven { url 'https://api.modrinth.com/maven' }
}
def snapshotFloodgate = file('../vendor/snapshot5/floodgate-fabric-2.2.7-infinity-snapshot5.jar')
dependencies {
 minecraft 'com.mojang:minecraft:26.4-snapshot-5'
 implementation 'net.fabricmc:fabric-loader:0.20.1'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.164.1+26.4'
 implementation 'eu.pb4:polymer-core:0.18.5-infinity-snapshot5+26.4-snapshot-5'
 implementation 'eu.pb4:polymer-blocks:0.18.5-infinity-snapshot5+26.4-snapshot-5'
 implementation 'eu.pb4:polymer-resource-pack:0.18.5-infinity-snapshot5+26.4-snapshot-5'
 implementation files(snapshotFloodgate)
 // Compile against the exact Cumulus library bundled by our pinned Floodgate.
 // Fabric loads that same nested library at runtime; do not bundle a second copy.
 compileOnly files(provider {
  assert snapshotFloodgate.isFile(): 'Build the pinned Snapshot 5 dependencies first.'
  zipTree(snapshotFloodgate).matching { include 'META-INF/jars/cumulus-1.1.2.jar' }.singleFile
 })
}

// 26.x is unobfuscated: the test mod jar ships as compiled, with no remapping step.
tasks.register('gametestJar', Jar) {
 dependsOn tasks.named('gametestClasses')
 from sourceSets.gametest.output
 archiveClassifier = 'gametest'
}
processResources {
 inputs.property 'version', project.version
 filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
sourceSets {
 gametest {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
}
loom {
 mods {
  convergence { sourceSet sourceSets.main }
  convergence_tests { sourceSet sourceSets.gametest }
 }
 runs {
  gametest {
   server()
   name 'Infinity Armor GameTests'
   source sourceSets.gametest
   runDir 'build/gametest'
   vmArg '-Dfabric-api.gametest'
   vmArg "-Dfabric-api.gametest.report-file=${file('build/gametest-results.xml')}"
  }
 }
}
